name: push_website
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Bounded below 10: mkdocs-material 9.x pins mkdocs<2 itself, so MkDocs 2.0 cannot
      # arrive transitively -- but a material 10.x release could adopt it, and upstream has
      # said 2.0 removes the plugin system and rewrites theming with no migration path.
      # Minor and patch updates still flow through, so fixes are not blocked.
      - run: pip install "mkdocs-material>=9.7,<10"
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
